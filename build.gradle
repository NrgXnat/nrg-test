def groupName = 'org.nrg'
def artifactName = 'nrg_test'
def buildVersion = '2.5-SNAPSHOT'

group groupName
version buildVersion

apply plugin: 'groovy'
apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'maven-publish'
apply plugin: 'net.linguica.maven-settings'
apply plugin: 'idea'
apply plugin: 'eclipse'
apply plugin: 'io.spring.dependency-management'

def vBom = '3.2-SNAPSHOT'
def vTestUtils = '2.6-SNAPSHOT'
def vMultiprocessor = '4.0'
def vJiraZephyr = '2.0'
def vGrxnat = '1.20-SNAPSHOT'

description = 'Framework for testing of NRG applications.'

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url 'https://plugins.gradle.org/m2/'
        }
    }
    dependencies {
        classpath "io.spring.gradle:dependency-management-plugin:1.0.3.RELEASE"
        classpath 'net.linguica.gradle:maven-settings-plugin:0.5'
    }
}

dependencyManagement {
    imports {
        mavenBom "org.nrg:test_dependencies:${vBom}"
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://nrgxnat.jfrog.io/nrgxnat/libs-release' }
    maven { url 'https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot' }
    maven { url 'https://nrgxnat.jfrog.io/nrgxnat/remote-repos' }
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

configurations.api {
    exclude(group: 'ch.qos.logback', module: 'logback-classic')
}

dependencies {
    api(group: 'org.codehaus.groovy', name: 'groovy-all', version: dependencyManagement.importedProperties['vGroovy'], ext: 'pom')
    api("org.nrg:test_utils:${vTestUtils}")
    api("org.nrg:jira-zephyr:${vJiraZephyr}")
    api("org.nrg:multiprocessor-scheduling:${vMultiprocessor}")
    api("org.nrg:grxnat:${vGrxnat}")
    api('org.testng:testng')
    api('com.fasterxml.jackson.core:jackson-databind')
    api('org.hibernate:hibernate-core')
    api('net.lingala.zip4j:zip4j')
    api('commons-net:commons-net')
    api('org.reflections:reflections')
    api('com.hierynomus:sshj')
    api('org.apache.commons:commons-math3')
    api('com.sun.mail:javax.mail')
    api('org.jsoup:jsoup')
    api('net.sf.opencsv:opencsv')
    api('net.imagej:imagej') {
        exclude(group: 'com.miglayout', module: 'miglayout')
    }
    api('ome:bio-formats_plugins')
    api('ome:formats-gpl') {
        exclude(group: 'ch.systems.cisd', module: 'logback-classic')
        exclude(group: 'ch.systems.cisd', module: 'jhdf5')
    }
}

java {
    withSourcesJar()
}

test {
    useTestNG {}
}

jar {
    from sourceSets.main.allSource

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId groupName
            artifactId artifactName
            version buildVersion

            from components.java

            pom.withXml {
                def root = asNode()
                root.appendNode('name', 'nrg_test')
                root.appendNode('url', 'https://bitbucket.org/xnatdev/nrg_test')
                root.appendNode('inceptionYear', '2017')

                def scm = root.appendNode('scm')
                scm.appendNode('url', 'https://bitbucket.org/xnatdev/nrg_test')
                scm.appendNode('connection', 'https://bitbucket.org/xnatdev/nrg_test')
                scm.appendNode('developerConnection', 'scm:git://bitbucket.org/xnatdev/nrg_test.git')

                def developers = root.appendNode('developers')

                def charlie = developers.appendNode('developer')
                charlie.appendNode('id', 'charlie')
                charlie.appendNode('name', 'Charlie Moore')
                charlie.appendNode('email', 'moore.c@wustl.edu')
            }
        }
    }
    repositories {
        maven {
            url "https://nrgxnat.jfrog.io/nrgxnat/libs-${project.version.endsWith("-SNAPSHOT") ? "snapshot" : "release"}-local"
            // The value for name must match <id> in ~/.m2/settings.xml
            name = "XNAT_Artifactory"
        }
    }
}

def propertyWithDefault(String property, Object value) {
    hasProperty(property) ? getProperty(property) : value
}

defaultTasks 'clean', 'jar', 'test', 'publishMavenJavaPublicationToMavenRepository', 'publishToMavenLocal'
